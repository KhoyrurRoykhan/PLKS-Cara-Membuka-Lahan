<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Konsep: aplikasi belajar bergaya "studio" — bilah judul ramping, panggung 3D dominan dengan subtitle di dasar, panel materi berkartu di sisi */
:root{
  --bg:#eef4ea; --surface:#ffffff; --surface2:#f4f8f1; --fg:#10281a; --muted:#55705c; --line:#d3e0cd;
  --accent:#1f7a3a; --accent-fg:#ffffff; --lime:#7cc531; --fire:#e8590c; --good:#1f7a3a; --bad:#c92a2a; --soft:#e3efdc;
  --shadow:0 10px 30px rgba(16,40,26,.12);
  --f-display:"Baloo 2","Trebuchet MS",sans-serif; --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1510; --surface:#13231a; --surface2:#182b20; --fg:#e8f4e6; --muted:#9ab8a1; --line:#28402f;
  --accent:#74c97f; --accent-fg:#0b1a10; --lime:#a3e04a; --fire:#ff8a4c; --good:#74c97f; --bad:#ff8080; --soft:#1d3426;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1510; --surface:#13231a; --surface2:#182b20; --fg:#e8f4e6; --muted:#9ab8a1; --line:#28402f;
  --accent:#74c97f; --accent-fg:#0b1a10; --lime:#a3e04a; --fire:#ff8a4c; --good:#74c97f; --bad:#ff8080; --soft:#1d3426;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:14px 26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex:none;width:44px;height:44px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1;margin:0}
.sub{color:var(--muted);font-weight:700;font-size:.9rem;line-height:1.2}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:800;font-size:14px;padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:700px){nav{grid-template-columns:repeat(2,minmax(0,1fr))}}
nav button{font:inherit;text-align:left;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:54px;min-width:0}
nav button b{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);font-family:var(--f-display);font-size:16px}
nav button span{font-weight:800;line-height:1.15;font-size:15px;min-width:0}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:var(--shadow)}
nav button[aria-selected="true"] b{background:rgba(255,255,255,.22);color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--fire);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:14px;align-items:start}
.main.proj{grid-template-columns:minmax(0,1fr)}
@media(max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
#stage{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);box-shadow:var(--shadow);background:#8fc9ee;aspect-ratio:16/10;min-height:300px;touch-action:none}
.proj #stage{aspect-ratio:16/9;max-height:78vh}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.95);color:#10281a;font-weight:800;font-size:13px;padding:4px 10px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.lb::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,255,255,.95)}
.lb.bad{background:#ffe3e3;color:#a61e1e}.lb.bad::after{border-top-color:#ffe3e3}
.lb.good{background:#d3f9d8;color:#1b5e20}.lb.good::after{border-top-color:#d3f9d8}
#badge{position:absolute;left:12px;top:12px;pointer-events:none;background:rgba(10,30,18,.72);color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em;padding:5px 12px;border-radius:999px;backdrop-filter:blur(4px)}
#hint{position:absolute;right:12px;top:12px;pointer-events:none;font-size:12px;font-weight:700;color:#fff;background:rgba(10,30,18,.55);padding:5px 11px;border-radius:999px;max-width:55%;text-align:right}
@media(max-width:560px){#hint{display:none}}
#sub{position:absolute;left:0;right:0;bottom:0;pointer-events:none;display:flex;justify-content:center;padding:0 12px 12px}
#sub span{max-width:min(760px,100%);background:rgba(8,24,14,.78);color:#fff;font-weight:700;font-size:clamp(14px,2.1vw,19px);line-height:1.35;padding:8px 16px;border-radius:14px;text-align:center;text-wrap:balance;backdrop-filter:blur(4px)}
#sub span:empty{display:none}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:1.45rem;margin:0;line-height:1.1;text-wrap:balance}
.panel p{margin:0}
.tag{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:800;padding:9px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;min-height:44px}
.btn.alt{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.alt.on{border-color:var(--accent);background:var(--soft)}
.btn.fire{background:var(--fire);border-color:var(--fire);color:#fff}
.info{border-left:6px solid var(--line);background:var(--soft);padding:10px 12px;border-radius:10px}
.info.good{border-color:var(--good)}.info.bad{border-color:var(--bad)}
.info b{display:block;font-family:var(--f-display);font-size:1.08rem;line-height:1.2}
ul.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps .btn{padding:8px 2px;font-size:14px}
.prog{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--accent))}
label.rng{display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
.meter{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:14px}
.meter .bar2{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.meter .bar2 i{display:block;height:100%;width:0;background:var(--fire)}
.meter.g .bar2 i{background:var(--good)}
#fallback{display:none;position:absolute;inset:0;place-items:center;padding:20px;font-weight:800;text-align:center}

<div class="wrap">

  <div class="main" id="main">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const canvas=$('#c'),stage=$('#stage'),labelsEl=$('#labels'),capt=$('#capt'),panel=$('#panel'),badge=$('#badge');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}catch(e){canvas.style.display='none';const f=$('#fallback');f.style.display='grid';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(46,1.6,0.1,700);
const hemi=new THREE.HemisphereLight(0xdff1ff,0x5e7f3f,0.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,1.2);sun.position.set(26,40,18);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0006;sun.shadow.normalBias=.04;
{const c=sun.shadow.camera;c.left=-46;c.right=46;c.top=40;c.bottom=-40;c.near=1;c.far=140;}
scene.add(sun);
const world=new THREE.Group();scene.add(world);

/* ---------- tekstur lembut ---------- */
function radial(stops,size){const s=size||128,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');

const TEX={
  soft:radial([[0,'rgba(255,255,255,1)'],[.4,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]),
  fire:radial([[0,'rgba(255,250,200,1)'],[.25,'rgba(255,190,60,.95)'],[.6,'rgba(255,90,10,.5)'],[1,'rgba(255,40,0,0)']]),

  sun:radial([[0,'rgba(255,255,240,1)'],[.12,'rgba(255,248,210,.95)'],[.3,'rgba(255,230,150,.35)'],[1,'rgba(255,220,120,0)']],256)};

/* ---------- langit, matahari, awan ---------- */
const DAY={top:new THREE.Color(0x2f86d6),hor:new THREE.Color(0xcfe8f5)},SMK={top:new THREE.Color(0x3b322e),hor:new THREE.Color(0x7d6d62)};
const skyU={top:{value:DAY.top.clone()},hor:{value:DAY.hor.clone()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(400,24,14),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 hor;varying vec3 vP;void main(){float h=clamp(vP.y*1.5+.02,0.,1.);gl_FragColor=vec4(mix(hor,top,pow(h,.65)),1.);}'}));
sky.renderOrder=-10;scene.add(sky);scene.fog=new THREE.Fog(DAY.hor.getHex(),70,260);
const sunSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.sun,transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));sunSpr.scale.set(110,110,1);scene.add(sunSpr);
const sunDir=sun.position.clone().normalize();
const clouds=[];const cloudMat=[];
for(let i=0;i<9;i++){const g=new THREE.Group();const n=4+(i%3);
  for(let k=0;k<n;k++){const m=new THREE.SpriteMaterial({map:TEX.soft,transparent:true,opacity:.92,depthWrite:false,fog:false});cloudMat.push(m);
    const s=new THREE.Sprite(m);s.position.set((k-n/2)*13+Math.sin(i*3+k)*4,Math.sin(k*2.1+i)*3,Math.cos(k*1.7+i)*6);s.scale.set(34+k%3*8,17+k%2*5,1);g.add(s);}
  g.position.set(-200+i*48,62+(i%4)*7,-70-(i%3)*35);g.userData.sp=2+(i%4)*.7;scene.add(g);clouds.push(g);}
let skyMix=0;
function smokeSky(k){skyMix=k;skyU.top.value.copy(DAY.top).lerp(SMK.top,k);skyU.hor.value.copy(DAY.hor).lerp(SMK.hor,k);
  scene.fog.color.copy(skyU.hor.value);scene.fog.near=70-k*38;scene.fog.far=260-k*140;
  hemi.intensity=.6-k*.3;sun.intensity=1.2-k*.75;sunSpr.material.opacity=1-k*.85;
  const c=1-k*.65;cloudMat.forEach(m=>m.color.setRGB(c,c*.98,c*.96));renderer.toneMappingExposure=.92-k*.17;}

/* ---------- kamera orbit ---------- */
const cur={th:0.7,ph:1.0,r:34,x:0,y:0,z:0},goal={...cur};let auto=false;
function fly(o){Object.assign(goal,o);}
function applyCam(dt){
  if(auto)goal.th+=dt*.07;
  for(const k in cur)cur[k]+=(goal[k]-cur[k])*Math.min(1,dt*6);
  goal.ph=Math.min(1.52,Math.max(0.2,goal.ph));goal.r=Math.min(80,Math.max(6,goal.r));
  const sp=Math.sin(cur.ph);
  camera.position.set(cur.x+cur.r*sp*Math.sin(cur.th),Math.max(1.2,cur.y+cur.r*Math.cos(cur.ph)),cur.z+cur.r*sp*Math.cos(cur.th));
  camera.lookAt(cur.x,cur.y,cur.z);
  sky.position.copy(camera.position);sunSpr.position.copy(camera.position).addScaledVector(sunDir,330);
}
const ptrs=new Map();let down=null,pinch=0;
canvas.addEventListener('pointerdown',e=>{auto=false;canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}});

  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){goal.th-=dx*0.007;goal.ph-=dy*0.006;if(down)down.moved+=Math.abs(dx)+Math.abs(dy);}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)goal.r*=pinch/d;pinch=d;if(down)down.moved+=99;}});
function up(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(had&&ptrs.size===0&&down&&down.moved<8&&performance.now()-down.t<500)pick(e.clientX,e.clientY);
  if(ptrs.size===0)down=null;pinch=0;}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();auto=false;goal.r*=1+Math.sign(e.deltaY)*0.08;},{passive:false});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(cx,cy){if(!cur_scene||!cur_scene.pick)return;
  const r=canvas.getBoundingClientRect();mv.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);ray.setFromCamera(mv,camera);
  const hits=ray.intersectObjects(world.children,true);
  for(const h of hits){let o=h.object;while(o){if(o.userData&&o.userData.pick){cur_scene.pick(o.userData.pick,h.point,o);return;}o=o.parent;}}}

/* ---------- bahan, bentuk dasar ---------- */
const mats={};
function M(c,o){const k=c+JSON.stringify(o||{});return mats[k]||(mats[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.92,metalness:0},o||{})));}
function MU(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.92,metalness:0},o||{}));}
function mesh(g,m,x,y,z,sh){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);if(sh!==false){o.castShadow=true;o.receiveShadow=true;}return o;}
const G={cyl:(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||8),cone:(r,h,s)=>new THREE.ConeGeometry(r,h,s||7),sph:(r,s)=>new THREE.SphereGeometry(r,s||8,s?Math.max(4,s-2):6),box:(w,h,d)=>new THREE.BoxGeometry(w,h,d),ico:(r,d)=>new THREE.IcosahedronGeometry(r,d||0)};
function ground(w,d,c,y){const o=new THREE.Mesh(new THREE.BoxGeometry(w,1,d),M(c));o.position.y=(y||0)-0.5;o.receiveShadow=true;return o;}
const rnd=(a,b)=>a+Math.random()*(b-a);
let seed=7;const sr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const cl=(v,a,b)=>Math.min(b==null?1:b,Math.max(a==null?0:a,v)),lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- lingkungan: bukit, rumput, bunga, sungai ---------- */
function env(o){o=o||{};const ex=o.exclude||[];
  const W=240,D=150,sx=48,sz=30,geo=new THREE.PlaneGeometry(W,D,sx,sz);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position,col=new Float32Array(pos.count*3),c1=new THREE.Color(0x7fbf55),c2=new THREE.Color(0x5a9a3c),c3=new THREE.Color(0x3f7a35),tc=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);
    const e=Math.max(0,Math.hypot(Math.max(0,Math.abs(x)-52)*.9,Math.max(0,Math.abs(z)-(o.zEdge||26))*1.3));
    const h=e>0?e*.42*(.7+.5*Math.sin(x*.21)*Math.cos(z*.17))+Math.sin(x*.5+z*.4)*e*.05:0;
    pos.setY(i,h);const n=(Math.sin(x*.31)+Math.cos(z*.27))*.25+.5;tc.copy(c1).lerp(c2,n).lerp(c3,Math.min(1,h/9));col[i*3]=tc.r;col[i*3+1]=tc.g;col[i*3+2]=tc.b;}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  const t=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1}));t.receiveShadow=true;t.position.y=-.02;world.add(t);
  /* bukit jauh */
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=135+Math.sin(i*2.3)*10;
    const h=mesh(G.cone(20+Math.sin(i*1.7)*7,26+Math.cos(i*2.9)*9,6),M(i%2?0x3d7a6a:0x4a8a6e),Math.cos(a)*r*1.1,10,Math.sin(a)*r*.75,false);world.add(h);}
  /* rumput instan */
  const N=o.grass||1600,gm=new THREE.InstancedMesh(new THREE.ConeGeometry(.1,.75,3),new THREE.MeshStandardMaterial({color:0xffffff,flatShading:true}),N),d=new THREE.Object3D(),ic=new THREE.Color();let n=0,tries=0;
  while(n<N&&tries<N*5){tries++;const x=(sr()-.5)*110,z=(sr()-.5)*56;if(ex.some(r=>Math.abs(x-r[0])<r[2]/2&&Math.abs(z-r[1])<r[3]/2))continue;
    d.position.set(x,.3,z);d.rotation.set((sr()-.5)*.4,sr()*6,(sr()-.5)*.4);d.scale.set(1,.7+sr()*.9,1);d.updateMatrix();gm.setMatrixAt(n,d.matrix);

   <div class="info bad" id="exp"><b>Mengapa tidak boleh membakar?</b>Asap membuat sesak napas, api menjalar ke hutan dan kebun lain, dan hewan kehilangan rumah.</div>
   <div class="info good"><b>Cara yang benar</b>Sisa tebasan ditumpuk dan dibiarkan membusuk. Di sisi kanan, tumpukan menjadi pupuk dan tunas tumbuh.</div>`);
  const $=A.$;
  function ignite(x,z){if(!burning){burning=true;t0=TT;extT=0;raining=false;caption('Api menjalar cepat dan asap menutupi langit.',true);fly({x:-14,y:4,z:0,r:34,th:.25,ph:1.2});}
    trees.forEach(t=>{const d=Math.hypot(t.x-x,t.z-z);t.start=Math.min(t.start,TT+d/4.2+(Math.abs(t.x*7.3)%1)*.4);});}
  function reset(){fly({x:0,y:2,z:0,r:50,th:.2,ph:1.0});burning=false;raining=false;extT=0;smoke=0;fled=0;caption('');smokeSky(0);glow.intensity=0;
    trees.forEach(t=>{t.start=Infinity;t.burn=0;t.g.scale.set(1,1,1);t.ash.scale.setScalar(.001);t.mats.forEach((m,i)=>m.color.copy(t.g0[i]));});
    fire.clear();smk.clear();emb.clear();rain.clear();deer.position.set(-9,0,6);deer.rotation.y=0;ape.position.set(-12,0,-6);}
  $('#ig').onclick=()=>ignite(-17,0);$('#of').onclick=reset;
  $('#rn').onclick=()=>{if(burning){raining=true;caption('Hujan turun dan memadamkan api, tetapi hutan sudah rusak.',true);}};
  fly({x:0,y:2,z:0,r:50,th:.2,ph:1.0});
  const black=new THREE.Color(0x141210);
  return{update(t,dt){TT=t;let nb=0,done=0,act=0;const live=[];
    if(raining)extT=Math.min(1,extT+dt*.22);
    const flameK=1-extT;
    trees.forEach(tr=>{const b=cl((t-tr.start)/7);const prev=tr.burn;tr.burn=raining?Math.max(prev,Math.min(b,prev+dt/7)):b;
      if(tr.burn>0){nb++;if(tr.burn>.85)done++;
        tr.mats.forEach((m,i)=>m.color.copy(tr.g0[i]).lerp(black,cl(tr.burn*(i==2?1:1.4))));
        tr.g.scale.set(1-tr.burn*.08,1-tr.burn*.22,1-tr.burn*.08);tr.ash.scale.setScalar(Math.max(.001,tr.burn*1.1));
        if(tr.burn<.88&&flameK>0.05){act++;live.push(tr);
          if(Math.random()<dt*34*flameK)fire.emit(tr.x+rnd(-1.5,1.5),rnd(3.5,9.5),tr.z+rnd(-1.3,1.3),{life:rnd(.6,1.1),vx:rnd(-.4,.4),vy:rnd(3,4.5),vz:rnd(-.4,.4),s0:rnd(3.2,4.6),s1:1,a:.95,pw:1.2,c0:0xffe066,c1:0xff3d00});
          if(Math.random()<dt*10*flameK)smk.emit(tr.x+rnd(-1,1),rnd(7,9),tr.z+rnd(-1,1),{life:rnd(4,6),vx:rnd(.2,1.4),vy:rnd(2.2,3.2),vz:rnd(-.5,.5),s0:2.2,s1:10,a:.62,pw:.8,c0:0x2e2927,c1:0x77695f});
          if(Math.random()<dt*3*flameK)emb.emit(tr.x+rnd(-1,1),rnd(3,6),tr.z+rnd(-1,1),{life:rnd(1.2,2.4),vx:rnd(-1,2),vy:rnd(2,4),vz:rnd(-1,1),s0:.35,s1:.1,a:1,c0:0xffc14d,c1:0xff5a00});}
        else if(tr.burn>=.88&&Math.random()<dt*2*(1-extT*.8))smk.emit(tr.x,2.2,tr.z,{life:4,vx:.5,vy:1.6,vz:0,s0:1.4,s1:6,a:.35,c0:0x55504c,c1:0x8a8078});}});
    if(raining)for(let i=0;i<5;i++)rain.emit(rnd(-32,-2),rnd(14,22),rnd(-13,13),{life:.7,vx:0,vy:-24,vz:0,s0:.16,s1:.16,a:.55,c0:0x9ad0ff});
    fire.update(dt);const sl=smk.update(dt);emb.update(dt);rain.update(dt);
    if(live.length){let cx=0,cz=0;live.forEach(b=>{cx+=b.x;cz+=b.z;});glow.position.set(cx/live.length,6,cz/live.length);}
    glow.intensity=Math.min(3.2,live.length*.55)*(.85+Math.sin(t*17)*.15)*flameK;
    const want=burning?Math.min(1,sl/70):0;smoke+=(want-smoke)*dt*(raining?.25:.7);smokeSky(smoke);
    /* hewan */
    if(burning&&nb>0)fled=Math.min(3,fled+dt*.9);
    if(burning&&fled>0){deer.position.x-=dt*6;deer.position.z+=dt;deer.rotation.y=Math.PI;ape.position.x-=dt*4.5;ape.position.z-=dt*1.5;ape.position.y=Math.abs(Math.sin(t*10))*.3;}
    else{deer.userData.head.rotation.z=Math.sin(t*1.5)*.25;ape.position.y=Math.abs(Math.sin(t*2))*.25;}
    birds.forEach((b,i)=>{const gone=burning&&fled>.3;const a=t*.7+i*1.3;b.position.set((gone?-36-(t-t0)*3:-17)+Math.cos(a)*(gone?3:9),10+Math.sin(t+i)*.8,Math.sin(a)*7);b.rotation.y=-a+Math.PI/2;b.userData.w.forEach((w,j)=>w.rotation.z=Math.sin(t*(gone?16:9))*.6*(j?-1:1));});
    calm.forEach((b,i)=>{const a=t*.5+i*2.1;b.position.set(17+Math.cos(a)*8,9+Math.sin(t*.8+i)*.8,Math.sin(a)*6);b.rotation.y=-a+Math.PI/2;b.userData.w.forEach((w,j)=>w.rotation.z=Math.sin(t*8)*.6*(j?-1:1));});
    grow+=dt;const g=(Math.sin(grow*.4-1.2)+1)/2;
    piles.forEach(p=>p.userData.s.forEach((s,k)=>s.scale.setScalar(Math.max(.001,cl(g*1.7-k*.12)))));
    deer2.userData.head.rotation.z=Math.sin(t*1.2)*.25;pr.userData.tick(t,false,true);
    const pc=Math.round(done/trees.length*100),lost=burning?Math.round(Math.min(3,fled)):0;
    $('#m1').textContent=pc;$('#b1').style.width=pc+'%';$('#b2').style.width=Math.round(smoke*100)+'%';$('#m3').textContent=lost;$('#b3').style.width=(lost/3*100)+'%';
  },pick(k,pt){if(k==='tree'&&!raining)ignite(pt.x,pt.z);},dispose(){smokeSky(0);}};
});
window.__PLKS.start();
})();
